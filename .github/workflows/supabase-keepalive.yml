name: Supabase keepalive

# Supabase's free tier pauses a project after 7 days with no activity (notice received
# 29 Oct 2026, project hhmogqbmakdrqewlljrs). This pings a single, deliberately harmless
# database function every 3 days to keep it active while the app is still in test with
# relatives.
#
# public.health_check() (supabase/migrations/20261029000001_health_check.sql) returns only
# the current time — it reads no table, so the anon key used here can't see any family data.
# Every table grant in this schema is scoped to the authenticated role only; anon has none.
#
# Runs on an off-peak minute (not :00, to avoid GitHub's busiest cron slot) every 3 days.
# GitHub disables scheduled workflows in a repo with no commits for 60 days — the "update log"
# step below commits a one-line timestamp each successful run so that never happens, without
# touching any app code.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase (fails the job on anything but HTTP 200)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/health_check" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"
          cat response.json
          if [ "$status" != "200" ]; then
            echo "::error::Supabase keepalive ping failed (HTTP $status)"
            exit 1
          fi

      - name: Record this run (keeps the repo active so GitHub doesn't disable the schedule)
        run: |
          mkdir -p ops
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) keepalive ping ok" >> ops/keepalive-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ops/keepalive-log.txt
          git diff --cached --quiet || git commit -m 'Supabase keepalive ping'
          git push
